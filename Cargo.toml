[package]
name = "naro"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "The familiar nano experience, rebuilt in Rust"
repository = "https://github.com/JLuethe/naro"
build = "build.rs"

[profile.release]
lto = true
codegen-units = 1

[[bin]]
name = "naro"
path = "src/main.rs"
