[package]
name = "naro"
version = "0.1.2"
edition = "2024"
license = "GPL-3.0-or-later"
description = "The familiar nano experience, rebuilt in Rust"
repository = "https://github.com/JLuethe/naro"
build = "build.rs"

[features]
default = []
credits = [] # Retained for existing build commands; --credits is available in all profiles.
test-hooks = []
tiny = []

[profile.release]
lto = true
codegen-units = 1

[[bin]]
name = "naro"
path = "src/main.rs"
