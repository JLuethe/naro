name: Rust
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable toolchain setup
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libncurses-dev libmagic-dev libevent-dev bison
      - name: Install the reference terminal emulator
        run: |
          curl --fail --location --retry 3 https://github.com/tmux/tmux/releases/download/3.8/tmux-3.8.tar.gz --output "$RUNNER_TEMP/tmux.tar.gz"
          printf '%s  %s\n' e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e "$RUNNER_TEMP/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/tmux.tar.gz" -C "$RUNNER_TEMP"
      - name: Build tmux 3.8
        working-directory: ${{ runner.temp }}/tmux-3.8
        run: |
          ./configure --prefix="$RUNNER_TEMP/tmux"
          make -j2
          make install
          printf '%s\n' "$RUNNER_TEMP/tmux/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo build --release
      - run: python3 spec/tools/audit_spec.py
      - run: python3 spec/tools/test_compare_runs.py
      - run: python3 spec/tools/test_nanoharness.py
      - run: python3 spec/tools/test_namespace_exec.py
      - run: python3 -m unittest discover -s tests/console -p 'test_*.py'
      - name: Terminal smoke and safety assertions
        run: |
          tmux -V
          python3 spec/tools/nanoharness.py spec/evidence/scenarios/smoke.json --binary "$PWD/target/release/naro" --out target/ci-smoke
          python3 spec/tools/nanoharness.py tests/scenarios/safety.json --binary "$PWD/target/release/naro" --out target/ci-safety
      - name: Linux console ioctl models
        run: python3 spec/tools/nanoharness.py tests/follow-up/scenarios/vt-ioctl.json --binary "$PWD/target/release/naro" --out target/ci-vt-ioctl
      - name: Recovery and optional credits
        run: |
          cargo build --features test-hooks --target-dir target/hooks
          python3 spec/tools/nanoharness.py tests/follow-up/scenarios/panic.json --binary "$PWD/target/hooks/debug/naro" --out target/ci-panic
          cargo build --release --features credits --target-dir target/credits
          python3 tools/check_extensions.py --default target/release/naro --credits target/credits/release/naro --panic-runs target/ci-panic --out target/ci-extensions
      - name: Installed assets, archive integrity and ownership
        run: |
          python3 tools/package.py --binary target/release/naro --out target/ci-package
          python3 tools/check_package.py --archive target/ci-package/naro-0.1.0-x86_64-unknown-linux-gnu.tar.gz --source-archive target/ci-package/naro-0.1.0-source.tar.gz --out target/ci-install
