name: Rust
on: [push, pull_request]
jobs:
  native-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable toolchain setup
      - run: sudo apt-get update && sudo apt-get install -y libncurses-dev libmagic-dev locales
      - run: sudo localedef -i en_US -f UTF-8 en_US.UTF-8
      - name: Native ARM64 default and tiny gates
        run: |
          test "$(uname -m)" = aarch64
          uname -a
          ldd --version
          cargo test --locked
          cargo test --locked --features tiny
          cargo build --locked --release --target-dir target/arm64-default
          cargo build --locked --release --features tiny --target-dir target/arm64-tiny
          sha256sum target/arm64-default/release/naro target/arm64-tiny/release/naro
          NARO_BUILD_INFO=1 target/arm64-default/release/naro
          NARO_BUILD_INFO=1 target/arm64-tiny/release/naro
          python3 tests/robustness/terminal_resources.py --binary "$PWD/target/arm64-default/release/naro" --expected-revision "$GITHUB_SHA" --out target/ci-arm64-terminal-resources-default
          python3 tests/robustness/hostile_inputs.py --binary "$PWD/target/arm64-default/release/naro" --expected-revision "$GITHUB_SHA" --out target/ci-arm64-hostile-inputs-default
          python3 tests/robustness/terminal_resources.py --tiny --binary "$PWD/target/arm64-tiny/release/naro" --expected-revision "$GITHUB_SHA" --out target/ci-arm64-terminal-resources-tiny
          python3 tests/robustness/hostile_inputs.py --tiny --binary "$PWD/target/arm64-tiny/release/naro" --expected-revision "$GITHUB_SHA" --out target/ci-arm64-hostile-inputs-tiny
  distinct-uid-backup:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable toolchain setup
      - run: sudo apt-get update && sudo apt-get install -y libncurses-dev libmagic-dev
      - name: Build the exact default test executable
        run: |
          mkdir -p target
          cargo test --no-run --message-format=json > target/ci-distinct-uid-build.jsonl
      - name: Require a distinct UID and exercise five backup-parent policies
        run: |
          candidate=$(python3 -c 'import json; print(next(r["executable"] for r in map(json.loads, open("target/ci-distinct-uid-build.jsonl")) if r.get("executable") and r.get("profile", {}).get("test")))')
          candidate=$(realpath "$candidate")
          repo_root=$PWD
          case_root="/tmp/naro-ci-distinct-uid-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$case_root"
          chmod 755 "$case_root"
          test "$(sudo -n id -u)" = 0
          cd /tmp
          sudo -n python3 "$repo_root/tests/backup/probe_namespace_actor.py" | tee "$repo_root/target/ci-distinct-uid-probe.json"
          cd "$repo_root"
          python3 -c 'import json; p=json.load(open("target/ci-distinct-uid-probe.json")); assert p["status"] == "pass" and p["actor_id"] != 0 and p["final_groups"] == []'
          cd /tmp
          for kind in foreign-owner-sticky foreign-owner-normal foreign-owner-private writable-mode-sticky writable-mode-private; do
            sudo -n python3 "$repo_root/tests/backup/parent_policy.py" --binary "$candidate" --out "$case_root/$kind" --only "$kind" --distinct-uid-actor
          done
          cd "$repo_root"
          NARO_CI_TEST_BINARY="$candidate" NARO_CI_CASE_ROOT="$case_root" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          kinds = ('foreign-owner-sticky', 'foreign-owner-normal', 'foreign-owner-private',
                   'writable-mode-sticky', 'writable-mode-private')
          candidate = Path(os.environ['NARO_CI_TEST_BINARY']).resolve(strict=True)
          case_root = Path(os.environ['NARO_CI_CASE_ROOT'])
          digest = hashlib.sha256(candidate.read_bytes()).hexdigest()
          actor = json.loads(Path('target/ci-distinct-uid-probe.json').read_text())['actor_id']
          for kind in kinds:
              report = json.loads((case_root / kind / 'report.json').read_text())
              assert Path(report['binary']) == candidate and report['sha256'] == digest
              assert len(report['cases']) == 1
              row = report['cases'][0]
              assert row['name'] == kind and row['status'] == 'pass'
              assert row['observed']['actor_id'] == actor
              print(f'{kind}: pass actor={actor} binary_sha256={digest}')
          PY
      - name: Bundle distinct UID receipts
        if: always()
        run: |
          case_root="/tmp/naro-ci-distinct-uid-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ -d "$case_root" ]; then
            sudo tar -czf target/ci-distinct-uid-cases.tar.gz -C /tmp "$(basename "$case_root")"
            sudo chmod 644 target/ci-distinct-uid-cases.tar.gz
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: distinct-uid-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/ci-distinct-uid-probe.json
            target/ci-distinct-uid-cases.tar.gz
          if-no-files-found: warn
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable toolchain setup
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libncurses-dev libmagic-dev libevent-dev bison gettext locales clang
      - run: sudo localedef -i en_US -f UTF-8 en_US.UTF-8
      - name: Install the reference terminal emulator
        run: |
          curl --fail --location --retry 3 https://github.com/tmux/tmux/releases/download/3.8/tmux-3.8.tar.gz --output "$RUNNER_TEMP/tmux.tar.gz"
          printf '%s  %s\n' e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e "$RUNNER_TEMP/tmux.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/tmux.tar.gz" -C "$RUNNER_TEMP"
      - name: Build tmux 3.8
        working-directory: ${{ runner.temp }}/tmux-3.8
        run: |
          ./configure --prefix="$RUNNER_TEMP/tmux"
          make -j2
          make install
          printf '%s\n' "$RUNNER_TEMP/tmux/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo test --all-features
      - name: Bounded undo and incremental search
        run: |
          python3 tests/undo/stress.py --out target/ci-undo-resources
          python3 tests/search/run.py --out target/ci-search-resources
          python3 tests/robustness/run_native.py --out target/ci-native-sanitizers
      - name: Typed catalog formatting, default and tiny
        run: |
          cargo test --no-run --message-format=json > target/ci-catalog-default-build.jsonl
          candidate=$(python3 -c 'import json; print(next(r["executable"] for r in map(json.loads, open("target/ci-catalog-default-build.jsonl")) if r.get("executable") and r.get("profile", {}).get("test")))')
          python3 tests/catalog/run.py --binary "$candidate" --out target/ci-catalog-default
          cargo test --no-run --features tiny --message-format=json > target/ci-catalog-tiny-build.jsonl
          candidate=$(python3 -c 'import json; print(next(r["executable"] for r in map(json.loads, open("target/ci-catalog-tiny-build.jsonl")) if r.get("executable") and r.get("profile", {}).get("test")))')
          python3 tests/catalog/run.py --binary "$candidate" --out target/ci-catalog-tiny
      - run: cargo build --release
      - name: NARO command-line identity
        run: python3 tools/check_branding.py --binary target/release/naro --out target/ci-branding
      - name: NARO identity and title fit boundaries
        run: python3 spec/tools/nanoharness.py --candidate-expectations tests/naro/identity-layout.json --binary "$PWD/target/release/naro" --out target/ci-identity-layout
      - run: python3 spec/tools/audit_spec.py --no-write
      - run: python3 spec/tools/test_compare_runs.py
      - run: python3 spec/tools/test_nanoharness.py
      - run: python3 tests/signals/native.py --out target/ci-signals-native
      - run: python3 spec/tools/test_candidate_expectations.py
      - run: python3 spec/tools/test_namespace_exec.py
      - name: Identity-aware qualification tooling contracts
        run: |
          python3 spec/tools/test_identity_review.py
          python3 tools/test_release_gate_evidence.py
          python3 tools/test_validate_accounting.py
          python3 tools/test_console_identity.py
          python3 tools/test_frozen_launchers.py
          python3 tools/test_frozen_process.py
          python3 tools/test_check_extensions.py
      - run: python3 -m unittest discover -s tests/console -p 'test_*.py'
      - name: Hard-wrap undo/redo scenario manifest
        run: |
          python3 tools/check_wrap_undo.py
          python3 -m unittest discover -s tools -p 'test_check_wrap_undo.py'
          python3 -m unittest discover -s tools -p 'test_closure_regressions.py'
          python3 -m unittest discover -s spec/tools -p 'test_audit_spec.py'
      - name: Terminal smoke and safety assertions
        run: |
          tmux -V
          python3 spec/tools/nanoharness.py --candidate-expectations spec/evidence/scenarios/smoke.json --binary "$PWD/target/release/naro" --out target/ci-smoke
          python3 spec/tools/nanoharness.py --candidate-expectations tests/scenarios/safety.json --binary "$PWD/target/release/naro" --out target/ci-safety
          python3 tests/signals/terminal.py --binary "$PWD/target/release/naro" --out target/ci-signals-terminal
          python3 tests/search/terminal.py --binary "$PWD/target/release/naro" --out target/ci-search-terminal
      - name: Production editor resource and hostile-input bounds
        run: |
          python3 -m unittest discover -s tests/robustness -p 'test_*.py'
          python3 tests/robustness/terminal_resources.py --binary "$PWD/target/release/naro" --expected-revision "$GITHUB_SHA" --out target/ci-terminal-resources
          python3 tests/robustness/hostile_inputs.py --binary "$PWD/target/release/naro" --expected-revision "$GITHUB_SHA" --out target/ci-hostile-inputs
      - name: Linux console ioctl models
        run: python3 spec/tools/nanoharness.py --candidate-expectations tests/follow-up/scenarios/vt-ioctl.json --binary "$PWD/target/release/naro" --out target/ci-vt-ioctl
      - name: Hard-wrap marks and command filters
        run: |
          python3 spec/tools/nanoharness.py --candidate-expectations tests/follow-up/scenarios/wrap-undo.json --binary "$PWD/target/release/naro" --out target/ci-wrap
          python3 spec/tools/nanoharness.py --candidate-expectations tests/follow-up/scenarios/filter.json --binary "$PWD/target/release/naro" --out target/ci-filter
      - name: Paste, soft-wrap, replacement and rcfile regressions
        run: python3 spec/tools/nanoharness.py --candidate-expectations tests/follow-up/scenarios/release-fixes.json --binary "$PWD/target/release/naro" --out target/ci-release-fixes
      - name: EOF, paging, view-mode paste, selection and Unicode quote regressions
        run: |
          python3 spec/tools/nanoharness.py --candidate-expectations tests/follow-up/scenarios/step3-gaps.json --binary "$PWD/target/release/naro" --out target/ci-step3-gaps
          NANOSPEC_WORK=/tmp/nanospec-formatter-completion python3 tests/follow-up/formatter_completion.py --binary "$PWD/target/release/naro" --out target/ci-formatter-completion
      - name: In-progress regular and FIFO save feedback
        run: |
          python3 tests/safe-save/test_progress_cases.py
          python3 tests/safe-save/progress_cases.py save-progress > target/ci-safe-save-progress.json
          python3 spec/tools/nanoharness.py target/ci-safe-save-progress.json --binary "$PWD/target/release/naro" --out target/ci-save-progress
      - name: Prepend preservation and backup feedback
        run: |
          python3 tests/safe-save/progress_cases.py save-safety > target/ci-safe-save-safety.json
          python3 spec/tools/nanoharness.py target/ci-safe-save-safety.json --binary "$PWD/target/release/naro" --out target/ci-save-safety
          python3 tests/remediation/safe_save_semantics.py --binary "$PWD/target/release/naro" --out target/ci-save-semantics
      - name: Atomic save faults, default and tiny
        run: |
          python3 -m unittest discover -s tests/safe-save -p 'test_run.py'
          python3 -m unittest tests/backup/test_parent_policy_setup.py
          cargo test --no-run --message-format=json > target/ci-safe-save-default-build.jsonl
          candidate=$(python3 -c 'import json; print(next(r["executable"] for r in map(json.loads, open("target/ci-safe-save-default-build.jsonl")) if r.get("executable") and r.get("profile", {}).get("test")))')
          python3 tests/safe-save/run.py --binary "$candidate" --out target/ci-safe-save-default
          python3 tests/backup/run_safe_save.py --binary "$candidate" --out target/ci-backup-safe-save
          cargo test --no-run --features tiny --message-format=json > target/ci-safe-save-tiny-build.jsonl
          candidate=$(python3 -c 'import json; print(next(r["executable"] for r in map(json.loads, open("target/ci-safe-save-tiny-build.jsonl")) if r.get("executable") and r.get("profile", {}).get("test")))')
          python3 tests/safe-save/run.py --binary "$candidate" --out target/ci-safe-save-tiny
      - name: Bounded confinement entry swaps, default and tiny
        run: |
          candidate=$(python3 -c 'import json; print(next(r["executable"] for r in map(json.loads, open("target/ci-safe-save-default-build.jsonl")) if r.get("executable") and r.get("profile", {}).get("test")))')
          python3 tests/confinement/run.py --binary "$candidate" --out target/ci-confinement-default
          python3 tests/confinement/parent_policy.py --binary "$candidate" --out target/ci-confinement-parent-policy-default
          python3 tests/backup/parent_policy.py --binary "$candidate" --out target/ci-backup-parent-policy
          set +e
          unshare --map-root-user --map-subids python3 tests/backup/probe_namespace_actor.py > target/ci-backup-namespace-probe.log 2>&1
          actor_probe_status=$?
          set -e
          cat target/ci-backup-namespace-probe.log
          if [ "$actor_probe_status" -eq 0 ]; then
            unshare --map-root-user --map-subids python3 tests/backup/parent_policy.py --binary "$candidate" --out target/ci-backup-foreign-owner-sticky --only foreign-owner-sticky --distinct-uid-actor
            unshare --map-root-user --map-subids python3 tests/backup/parent_policy.py --binary "$candidate" --out target/ci-backup-foreign-owner-normal --only foreign-owner-normal --distinct-uid-actor
            unshare --map-root-user --map-subids python3 tests/backup/parent_policy.py --binary "$candidate" --out target/ci-backup-foreign-owner-private --only foreign-owner-private --distinct-uid-actor
            unshare --map-root-user --map-subids python3 tests/backup/parent_policy.py --binary "$candidate" --out target/ci-backup-writable-mode-sticky --only writable-mode-sticky --distinct-uid-actor
            unshare --map-root-user --map-subids python3 tests/backup/parent_policy.py --binary "$candidate" --out target/ci-backup-writable-mode-private --only writable-mode-private --distinct-uid-actor
          elif [ "$actor_probe_status" -eq 1 ] && python3 tests/backup/probe_namespace_actor.py --is-missing-log "$actor_probe_status" target/ci-backup-namespace-probe.log; then
            echo '::notice::distinct-UID backup cases are unqualified here: namespace actor prerequisites are unavailable; independent mapped-UID receipts are documented separately'
          else
            exit "$actor_probe_status"
          fi
          candidate=$(python3 -c 'import json; print(next(r["executable"] for r in map(json.loads, open("target/ci-safe-save-tiny-build.jsonl")) if r.get("executable") and r.get("profile", {}).get("test")))')
          python3 tests/confinement/run.py --binary "$candidate" --out target/ci-confinement-tiny --tiny
          python3 tests/confinement/parent_policy.py --binary "$candidate" --out target/ci-confinement-parent-policy-tiny
      - name: Optional tiny profile
        run: |
          cargo build --release --features tiny --target-dir target/tiny
          python3 tests/robustness/terminal_resources.py --tiny --binary "$PWD/target/tiny/release/naro" --expected-revision "$GITHUB_SHA" --out target/ci-terminal-resources-tiny
          python3 tests/robustness/hostile_inputs.py --tiny --binary "$PWD/target/tiny/release/naro" --expected-revision "$GITHUB_SHA" --out target/ci-hostile-inputs-tiny
          python3 tools/check_branding.py --binary target/tiny/release/naro --profile tiny --out target/ci-branding-tiny
          python3 tools/check_tiny_ci.py --binary target/tiny/release/naro --out target/ci-tiny
          python3 tests/remediation/tiny_fifo_resize.py --binary "$PWD/target/tiny/release/naro" --out target/ci-tiny-fifo-resize
          python3 tests/signals/terminal.py --tiny --binary "$PWD/target/tiny/release/naro" --out target/ci-signals-tiny
          python3 tests/search/terminal.py --tiny --binary "$PWD/target/tiny/release/naro" --out target/ci-search-terminal-tiny
          python3 tools/test_measure_profiles.py
          python3 tools/measure_profiles.py --full target/release/naro --tiny target/tiny/release/naro --out target/ci-profile-sizes
      - name: Recovery and credits compatibility
        run: |
          cargo build --features test-hooks --target-dir target/hooks
          python3 spec/tools/nanoharness.py --candidate-expectations tests/follow-up/scenarios/panic.json --binary "$PWD/target/hooks/debug/naro" --out target/ci-panic
          python3 tests/recovery/run.py --binary "$PWD/target/hooks/debug/naro" --out target/ci-recovery-durability
          cargo build --features tiny,test-hooks --target-dir target/recovery-tiny-hooks
          python3 tests/recovery/run.py --tiny --binary "$PWD/target/recovery-tiny-hooks/debug/naro" --out target/ci-recovery-durability-tiny
          cargo build --release --features credits --target-dir target/credits
          python3 tools/check_extensions.py --default target/release/naro --credits target/credits/release/naro --panic-runs target/ci-panic --panic-binary target/hooks/debug/naro --out target/ci-extensions
      - name: Issue 14 production runtime and ordered key tables
        run: |
          python3 tests/issue14/run.py --binary "$PWD/target/release/naro" --hooks-binary "$PWD/target/hooks/debug/naro" --tiny-hooks-binary "$PWD/target/recovery-tiny-hooks/debug/naro" --recorded-oracles --out target/ci-issue14-runtime
      - name: Installed assets, archive integrity and ownership
        run: |
          python3 -m unittest discover -s tools -p 'test_package_docs.py'
          python3 -m unittest discover -s tools -p 'test_package_provenance.py'
          python3 -m unittest discover -s tools -p 'test_installer_transactions.py'
          python3 tools/package.py --binary target/release/naro --out target/ci-package
          python3 tools/check_package.py --archive target/ci-package/naro-0.1.3-x86_64-unknown-linux-gnu.tar.gz --source-archive target/ci-package/naro-0.1.3-source.tar.gz --out target/ci-install
